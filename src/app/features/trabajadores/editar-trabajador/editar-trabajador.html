<div class="contenedor-nuevo-trabajador">

  <div class="encabezado">

    <div>
      <h1>Editar trabajador</h1>
      <p>Actualización de antecedentes personales, laborales y previsionales</p>
    </div>

    <button
      class="btn-volver"
      type="button"
      [routerLink]="['/trabajadores']"
      [queryParams]="{ companyId: companyId }">
      Volver
    </button>

  </div>

  <div class="formulario">

    <!-- CARGANDO -->
    <div
      *ngIf="cargando"
      class="mensaje-cargando">
      Cargando trabajador...
    </div>

    <!-- ERROR -->
    <div
      *ngIf="!cargando && errorMessage"
      class="mensaje-error">
      {{ errorMessage }}
    </div>

    <ng-container *ngIf="!cargando">

      <!-- DATOS PERSONALES -->
      <div class="seccion">

        <h2>Datos personales</h2>

        <div class="grid">

          <div class="campo">
            <label for="rut">RUT</label>

            <input
              id="rut"
              name="rut"
              type="text"
              [(ngModel)]="trabajador.rut"
              placeholder="12.345.678-9">
          </div>

          <div class="campo">
            <label for="nombres">Nombres</label>

            <input
              id="nombres"
              name="nombres"
              type="text"
              [(ngModel)]="trabajador.nombres">
          </div>

          <div class="campo">
            <label for="apellido_paterno">
              Apellido paterno
            </label>

            <input
              id="apellido_paterno"
              name="apellido_paterno"
              type="text"
              [(ngModel)]="trabajador.apellido_paterno">
          </div>

          <div class="campo">
            <label for="apellido_materno">
              Apellido materno
            </label>

            <input
              id="apellido_materno"
              name="apellido_materno"
              type="text"
              [(ngModel)]="trabajador.apellido_materno">
          </div>

        </div>

      </div>

      <!-- ANTECEDENTES LABORALES -->
      <div class="seccion">

        <h2>Antecedentes laborales</h2>

        <div class="grid">

          <div class="campo">
            <label for="fecha_ingreso">
              Fecha de ingreso
            </label>

            <input
              id="fecha_ingreso"
              name="fecha_ingreso"
              type="date"
              [(ngModel)]="trabajador.fecha_ingreso">
          </div>

          <div class="campo">
            <label for="fecha_termino">
              Fecha de término
            </label>

            <input
              id="fecha_termino"
              name="fecha_termino"
              type="date"
              [(ngModel)]="trabajador.fecha_termino">
          </div>

          <div class="campo">
            <label for="tipo_contrato">
              Tipo de contrato
            </label>

            <select
              id="tipo_contrato"
              name="tipo_contrato"
              [(ngModel)]="trabajador.tipo_contrato">

              <option value="">
                Seleccione tipo de contrato
              </option>

              <option value="INDEFINIDO">
                Indefinido
              </option>

              <option value="PLAZO_FIJO">
                Plazo fijo
              </option>

              <option value="OBRA_FAENA">
                Obra o faena
              </option>

            </select>
          </div>

          <div class="campo">
            <label for="cargo">
              Cargo
            </label>

            <input
              id="cargo"
              name="cargo"
              type="text"
              [(ngModel)]="trabajador.cargo">
          </div>

          <div class="campo">
            <label for="sueldo_base">
              Sueldo base
            </label>

            <input
              id="sueldo_base"
              name="sueldo_base"
              type="number"
              min="0"
              [(ngModel)]="trabajador.sueldo_base">
          </div>

          <div class="campo">
            <label for="estado">
              Estado
            </label>

            <select
              id="estado"
              name="estado"
              [(ngModel)]="trabajador.estado">

              <option [ngValue]="1">
                Activo
              </option>

              <option [ngValue]="0">
                Inactivo
              </option>

            </select>
          </div>

        </div>

      </div>

      <!-- PREVISIÓN -->
      <div class="seccion">

        <h2>Previsión</h2>

        <div class="grid">

          <div class="campo">
            <label for="afp_nombre">
              AFP
            </label>

            <select
              id="afp_nombre"
              name="afp_nombre"
              [(ngModel)]="trabajador.afp_nombre">

              <option value="">
                Seleccione AFP
              </option>

              <option value="CAPITAL">
                Capital
              </option>

              <option value="CUPRUM">
                Cuprum
              </option>

              <option value="HABITAT">
                Habitat
              </option>

              <option value="MODELO">
                Modelo
              </option>

              <option value="PLANVITAL">
                PlanVital
              </option>

              <option value="PROVIDA">
                Provida
              </option>

              <option value="UNO">
                Uno
              </option>

            </select>
          </div>

          <div class="campo">
            <label for="salud_tipo">
              Sistema de salud
            </label>

            <select
              id="salud_tipo"
              name="salud_tipo"
              [(ngModel)]="trabajador.salud_tipo"
              (ngModelChange)="cambiarTipoSalud()">

              <option value="">
                Seleccione sistema
              </option>

              <option value="FONASA">
                Fonasa
              </option>

              <option value="ISAPRE">
                Isapre
              </option>

            </select>
          </div>

          <div class="campo">
            <label for="salud_institucion">
              Institución de salud
            </label>

            <input
              id="salud_institucion"
              name="salud_institucion"
              type="text"
              [(ngModel)]="trabajador.salud_institucion"
              [disabled]="trabajador.salud_tipo === 'FONASA'"
              placeholder="Fonasa o nombre de Isapre">
          </div>

          <div class="campo">
            <label for="salud_tipo_valor">
              Tipo de valor salud
            </label>

            <select
              id="salud_tipo_valor"
              name="salud_tipo_valor"
              [(ngModel)]="trabajador.salud_tipo_valor"
              [disabled]="trabajador.salud_tipo === 'FONASA'">

              <option value="">
                Seleccione tipo
              </option>

              <option value="PORCENTAJE">
                Porcentaje
              </option>

              <option value="UF">
                UF
              </option>

              <option value="PESOS">
                Pesos
              </option>

            </select>
          </div>

          <div class="campo">
            <label for="salud_valor">
              Valor salud
            </label>

            <input
              id="salud_valor"
              name="salud_valor"
              type="number"
              min="0"
              step="0.01"
              [(ngModel)]="trabajador.salud_valor"
              [disabled]="trabajador.salud_tipo === 'FONASA'">
          </div>

        </div>

      </div>

      <!-- ACCIONES -->
      <div class="acciones">

        <button
          class="btn-cancelar"
          type="button"
          [routerLink]="['/trabajadores']"
          [queryParams]="{ companyId: companyId }">
          Cancelar
        </button>

        <button
          class="btn-guardar"
          type="button"
          (click)="guardar()"
          [disabled]="guardando || !trabajadorId">

          {{
            guardando
              ? 'Guardando...'
              : 'Guardar cambios'
          }}

        </button>

      </div>

    </ng-container>

  </div>

</div>
